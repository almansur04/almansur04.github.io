---
layout: default
---

<!-- Provide a direct path back to the main portfolio -->
<div style="margin-bottom: 2rem;">
    <a
        href="/"
        style="text-decoration: none; font-weight: 600; color: var(--text-muted);"
    >
        &larr; Back to Portfolio
    </a>
</div>

<!-- Constrain article width for comfortable long-form reading -->
<article style="max-width: 680px; margin: 0 auto;">
    <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem;">
        {{ page.title }}
    </h1>

    <div class="meta" style="margin-bottom: 2rem;">
        Published on {{ page.date | date: "%B %d, %Y" }}
    </div>

    <!-- Render Markdown post content using the shared portfolio typography -->
    <div class="description" style="font-size: 1.05rem; line-height: 1.8;">
        {{ content }}
    </div>
</article>
