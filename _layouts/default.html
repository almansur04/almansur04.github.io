<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almansur Kakimov</title>
    <style>
        :root {
        --bg-color: #fbfbfd;
        --text-main: #1d1d1f;
        --text-muted: #6e6e73;
        --border-color: #d2d2d7;
        --accent-pill: #e8e8ed;
        --pill-text: #1d1d1f;
        --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --header-stack: "Inter", -apple-system, sans-serif;
    }
    
    [data-theme="dark"] {
        --bg-color: #161617;
        --text-main: #f5f5f7;
        --text-muted: #a1a1a6;
        --border-color: #3a3a3c;
        --accent-pill: #2c2c2e;
        --pill-text: #f5f5f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: var(--font-stack);
        background-color: var(--bg-color);
        color: var(--text-main);
        line-height: 1.65;
        max-width: 880px;
        margin: 0 auto;
        padding: 5rem 2.5rem;
        -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 { font-family: var(--header-stack); }
    
    h1 { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.05em; margin-bottom: 0.5rem; }
    
    h2 { 
        font-size: 1.15rem; 
        font-weight: 600; 
        text-transform: uppercase; 
        letter-spacing: 0.08em;
        color: var(--text-muted);
        margin: 4rem 0 2rem 0; 
        display: flex;
        align-items: center;
        text-align: center;
    }
    
    h2::before, h2::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid var(--border-color);
        opacity: 0.6;
    }
    h2::before { margin-right: 1.5rem; }
    h2::after { margin-left: 1.5rem; }

    h3 { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.25rem; }

    a { color: var(--text-main); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: var(--text-muted); }

    .subtitle { font-size: 1.3rem; color: var(--text-muted); font-weight: 400; margin-bottom: 1.5rem; }
    
    .contact-info { display: flex; flex-wrap: wrap; gap: 1.5rem; font-size: 0.95rem; margin-bottom: 3rem; }
    .contact-info span { color: var(--text-muted); font-weight: 500; }
    
    .item { margin-bottom: 2.5rem; }
    .item-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 0.5rem; gap: 0.2rem 1rem;}
    .meta { font-size: 0.9rem; color: var(--text-muted); }
    .description { font-size: 1rem; color: var(--text-main); font-weight: 400;}
    [data-theme="dark"] .description { color: #d2d2d7; }
    
    ul { margin-left: 1.2rem; margin-top: 0.5rem; font-size: 1rem; }
    li { margin-bottom: 0.35rem; }

    .header-cta { text-align: center; margin-top: 2rem; }
    .btn { 
        display: inline-block; 
        background-color: var(--text-main); 
        color: var(--bg-color); 
        padding: 0.6rem 1.4rem; 
        text-decoration: none !important;
        font-size: 0.95rem; 
        font-weight: 600; 
        border-radius: 6px; 
        transition: all 0.2s ease-in-out; 
        border: 1px solid transparent;
    }
    .btn:hover { background-color: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
    [data-theme="dark"] .btn { background-color: var(--text-main); color: var(--bg-color); }
    [data-theme="dark"] .btn:hover { background-color: #2c2c2e; border-color: transparent; color: var(--text-main);}

    .skills-matrix { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem 1rem; margin-top: 1.5rem; }
    
    .matrix-column h3 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.75rem;}
    .matrix-column ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    
    .matrix-column li { 
        font-size: 0.85rem; 
        background-color: var(--accent-pill); 
        color: var(--pill-text);
        padding: 0.25rem 0.6rem; 
        border-radius: 4px; 
        margin: 0;
        white-space: nowrap;
        transition: transform 0.1s ease;
    }
    .matrix-column li:hover { transform: translateY(-1px); }

    [data-theme="dark"] .matrix-column li { background-color: #2c2c2e; border: 1px solid transparent; }
    
    .pill-major { background-color: var(--text-main) !important; color: var(--bg-color) !important; font-weight: 600;}
    [data-theme="dark"] .pill-major { background-color: var(--accent-pill) !important; color: var(--bg-color) !important;}
    
    .pill-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; letter-spacing: -0.01em;}

    .theme-toggle { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.25rem 0.75rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
    .theme-toggle:hover { background: var(--text-main); color: var(--bg-color); }
    [data-theme="dark"] .theme-toggle { border-color: #3a3a3c; color: var(--text-main); }
    [data-theme="dark"] .theme-toggle:hover { background-color: var(--accent-pill); color: var(--pill-text); border-color: transparent;}

    @media (max-width: 600px) {
        body { padding: 3rem 1.5rem; }
        h1 { font-size: 2.2rem; }
        .subtitle { font-size: 1.1rem; }
        .item-header { flex-direction: column; gap: 0; }
        .meta { margin-top: 0.1rem; }
        h2 { font-size: 0.9rem; margin: 3rem 0 1.5rem 0; }
        h2::before { margin-right: 1rem; }
        h2::after { margin-left: 1rem; }
        .skills-matrix { gap: 1rem; }
        .matrix-column { padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);}
        .matrix-column:last-child { border-bottom: none; }
    }
    </style>
</head>
<body>
    <button id="theme-toggle" class="theme-toggle">Dark Mode</button>
    
    {{ content }}

    <footer style="margin-top: 4rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 2rem;">
        &copy; 2026 Almansur Kakimov. Designed for academic review.
    </footer>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggleBtn.textContent = 'Light Mode';
        }
        toggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                toggleBtn.textContent = 'Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                toggleBtn.textContent = 'Light Mode';
            }
        });
    </script>
</body>
</html>
