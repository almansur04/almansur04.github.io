<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almansur Kakimov</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #e5e5e5;
        }
        
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.05em; margin-bottom: 0.5rem; }
        h2 { font-size: 1.25rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; margin: 3rem 0 1.5rem 0; }
        h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.25rem; }

        a { color: var(--text-main); text-decoration: underline; text-underline-offset: 3px; }
        a:hover { color: var(--text-muted); }

        .subtitle { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        .contact-info { display: flex; flex-wrap: wrap; gap: 1.5rem; font-size: 0.95rem; margin-bottom: 3rem; }
        .contact-info span { color: var(--text-muted); }
        
        .item { margin-bottom: 2rem; }
        .item-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 0.5rem; }
        .meta { font-size: 0.9rem; color: var(--text-muted); }
        .description { font-size: 0.95rem; color: #333; }
        [data-theme="dark"] .description { color: var(--text-main); }
        
        ul { margin-left: 1.2rem; margin-top: 0.5rem; font-size: 0.95rem; }
        li { margin-bottom: 0.25rem; }

        .tag { display: inline-block; background: #f4f4f4; padding: 0.1rem 0.5rem; border: 1px solid var(--border-color); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 0.5rem; margin-bottom: 0.5rem; }
        [data-theme="dark"] .tag { background: #1e1e1e; }

        .btn { display: inline-block; background-color: var(--text-main); color: var(--bg-color); padding: 0.5rem 1rem; text-decoration: none; font-size: 0.9rem; font-weight: 600; border-radius: 4px; margin-top: 1rem; transition: background-color 0.2s; }
        .btn:hover { background-color: var(--text-muted); color: var(--bg-color); }

        .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
        .skill-category h3 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 0.25rem; margin-bottom: 0.5rem; }
        .skill-category p { font-size: 0.95rem; }

        .theme-toggle { position: absolute; top: 2rem; right: 2rem; background: none; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.25rem 0.75rem; font-size: 0.8rem; cursor: pointer; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
        .theme-toggle:hover { background: var(--text-main); color: var(--bg-color); }

        @media (max-width: 600px) {
            body { padding: 2rem 1.5rem; }
            .item-header { flex-direction: column; }
            .theme-toggle { top: 1rem; right: 1.5rem; }
        }
    </style>
</head>
<body>
    <button id="theme-toggle" class="theme-toggle">Dark Mode</button>
    
    {{ content }}

    <footer style="margin-top: 4rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 2rem;">
        &copy; 2026 Almansur Kakimov. Designed for academic review.
    </footer>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggleBtn.textContent = 'Light Mode';
        }
        toggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                toggleBtn.textContent = 'Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                toggleBtn.textContent = 'Light Mode';
            }
        });
    </script>
</body>
</html>
